name: 'btanalyzer'
description: 'Analyze .NET build performance and optionally gate CI on regressions or findings.'
branding:
  icon: 'clock'
  color: 'blue'

inputs:
  project:
    description: 'Project or solution to build and analyze (default: current directory)'
    required: false
    default: ''
  output:
    description: 'Report output path; the extension picks the format (.sarif, .md, .json, .html)'
    required: false
    default: 'btanalyzer.sarif'
  args:
    description: 'Extra arguments passed to "btanalyzer build" (e.g. "--fail-on regression:10 --compare git:origin/main:baseline.json -c Release")'
    required: false
    default: ''
  version:
    description: 'btanalyzer release tag to install (default: latest)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install btanalyzer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "::error::The btanalyzer action currently supports Linux runners only (got ${RUNNER_OS}). Run 'btanalyzer' directly on other platforms."
          exit 1
        fi
        tag="${{ inputs.version }}"
        if [ "$tag" = "latest" ]; then
          tag="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/minorum/BuildTimingAnalyzer/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+')"
        fi
        dest="${RUNNER_TEMP}/btanalyzer"
        mkdir -p "$dest"
        curl -fsSL \
          "https://github.com/minorum/BuildTimingAnalyzer/releases/download/${tag}/btanalyzer-linux-x64-${tag}.tar.gz" \
          -o "$dest/btanalyzer.tar.gz"
        tar -xzf "$dest/btanalyzer.tar.gz" -C "$dest"
        bin="$(find "$dest" -name btanalyzer -type f | head -n1)"
        chmod +x "$bin"
        # Add to PATH without needing sudo/write access to /usr/local/bin (works on hosted + self-hosted).
        echo "$(dirname "$bin")" >> "$GITHUB_PATH"

    - name: Run btanalyzer
      shell: bash
      run: btanalyzer build ${{ inputs.project }} --no-open -o "${{ inputs.output }}" ${{ inputs.args }}
